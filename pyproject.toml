[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthpriv"
version = "0.1.0"
description = "Generacion de datos sinteticos preservando privacidad"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "sdv>=1.15,<2",
    "sdmetrics>=0.17,<1",
    "anonymeter>=0.16",
    "opacus>=1.4",
    "click>=8.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
synthpriv = "synthpriv.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that train deep generative models (excluded by default)",
]
addopts = "-m 'not slow and not deep'"
filterwarnings = [
    "ignore:.*SingleTableMetadata.*deprecated:FutureWarning",
    "ignore:Full backward hook.*:UserWarning",
    "ignore:Secure RNG turned off.*:UserWarning",
    "ignore:Optimal order is the largest alpha.*:UserWarning",
]