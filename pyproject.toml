[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthpriv"
description = "Tabular data synthesis preserving differential privacy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
# <3.13: anonymeter 1.1.0 pins numpy<1.27, which ships no 3.13 wheels
# (sdv/sdmetrics support 3.13; drop the cap when anonymeter relaxes the pin).
requires-python = ">=3.10,<3.13"
dynamic = ["version"]
authors = [
    { name = "Carlos", email = "921charly@gmail.com" },
]
keywords = [
    "synthetic-data",
    "differential-privacy",
    "dp-sgd",
    "gan",
    "copula",
    "tabular",
    "sdv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "sdv>=1.15,<2",
    "sdmetrics>=0.17,<1",
    "anonymeter>=0.16",
    "opacus>=1.4",
    "click>=8.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "build>=1.0", "twine>=5.0"]
docs = ["sphinx>=7,<9", "furo>=2024.1.29", "myst-parser>=3.0", "sphinx-copybutton>=0.5.2", "mike>=2.1"]

[project.urls]
Homepage = "https://github.com/Tzinny-dev/synthpriv"
Documentation = "https://tzinny-dev.github.io/synthpriv/"
Changelog = "https://github.com/Tzinny-dev/synthpriv/blob/main/CHANGELOG.md"
Repository = "https://github.com/Tzinny-dev/synthpriv"
Issues = "https://github.com/Tzinny-dev/synthpriv/issues"

[project.scripts]
synthpriv = "synthpriv.cli:cli"

[tool.setuptools]
# Single source of truth for the version: src/synthpriv/__init__.py __version__
[tool.setuptools.dynamic]
version = { attr = "synthpriv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that train deep generative models (excluded by default)",
]
addopts = "-m 'not slow and not deep'"
filterwarnings = [
    "ignore:.*SingleTableMetadata.*deprecated:FutureWarning",
    "ignore:Full backward hook.*:UserWarning",
    "ignore:Secure RNG turned off.*:UserWarning",
    "ignore:Optimal order is the largest alpha.*:UserWarning",
]