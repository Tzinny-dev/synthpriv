name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Docs version to deploy manually (e.g. 0.2)"
        required: true

permissions:
  contents: write # push the versioned docs branch (mike)
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mike needs the docs branch history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Expose the Pages base URL (honours a custom domain)
        run: echo "DOCS_BASE_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"

      - name: Build only (pull-request check; warnings = errors)
        if: github.event_name == 'pull_request'
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Deploy versioned docs (mike)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${{ github.ref_name }}"; RAW="${RAW#v}"
            VERSION="$(echo "$RAW" | cut -d. -f1,2)" # 0.2.1 -> 0.2 (mike line)
            python docs/deploy_version.py "$VERSION" --title "$RAW" \
              --alias latest --set-default --push
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python docs/deploy_version.py "${{ inputs.version }}" \
              --title "${{ inputs.version }}" --alias latest --set-default --push
          else
            python docs/deploy_version.py dev --title "dev (unreleased)" \
              --set-default-if-missing --push
          fi

      - name: Checkout the deployed docs
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

